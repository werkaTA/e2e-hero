<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>e2e - Open Source AI testing framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #111111;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #grad {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(22, 22, 22, 0) 45%, #161616 100%);
  }
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    padding: 24px 40px 0;
    pointer-events: none;
  }
  .nav-inner {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { height: 32px; width: auto; display: block; }
  .brand .slash {
    font: 400 30px/30px "DM Mono", monospace;
    letter-spacing: -0.06em;
    color: #F9F8F7;
  }
  .brand .navmark { height: 22px; width: auto; display: block; }
  .tagline {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font: 400 16px/32.5px "DM Mono", monospace;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.63);
    white-space: nowrap;
  }
  .doc {
    font: 400 16px/32.5px "DM Mono", monospace;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.9);
    text-decoration: none;
    pointer-events: auto;
  }
  .doc:hover { color: #ffffff; }
  @media (max-width: 980px) { .tagline { display: none; } }
  main {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .stack { display: flex; flex-direction: column; align-items: center; }
  #mark { position: relative; width: 328px; height: 147px; }
  #mark img { width: 328px; height: 147px; display: block; user-select: none; -webkit-user-drag: none; }
  .mark-sharp {
    position: relative;
    z-index: 1;
  }
  .mark-glow {
    position: absolute;
    inset: 0;
    filter: blur(10px);
    opacity: 0.6;
  }
  .copy {
    margin: 54px 0 0;
    width: 391px;
    font: 400 16px/32.5px "DM Mono", monospace;
    text-transform: uppercase;
    text-align: center;
    color: rgba(255, 255, 255, 0.9);
  }
  #cmd {
    margin-top: 54px;
    position: relative;
    width: 167px;
    height: 48px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    pointer-events: auto;
  }
  .cmd-glow {
    position: absolute;
    inset: -2.5px;
    background: radial-gradient(70px 50px at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.25) 40%, rgba(255, 255, 255, 0) 72%);
    filter: blur(4px);
    opacity: 0.45;
    transition: opacity 0.3s ease;
  }
  #cmd:hover .cmd-glow { opacity: 1; }
  .cmd-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 167px;
    height: 48px;
    padding: 0 14px;
    box-sizing: border-box;
    background: rgba(22, 22, 22, 0.9);
    border: 0.5px solid rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(4px);
    transition: border-color 0.3s ease;
  }
  #cmd:hover .cmd-box { border-color: #ffffff; }
  .cmd-text {
    display: flex;
    gap: 6px;
    font: 400 16px/24px "Inter", system-ui, sans-serif;
    color: #ffffff;
  }
  .cmd-text .dollar { opacity: 0.5; }
  .cmd-icon { position: relative; width: 16px; height: 16px; }
  .cmd-icon svg { position: absolute; inset: 0; transition: opacity 0.25s ease; }
  .cmd-icon .icon-check { opacity: 0; }
  #cmd.copied .icon-copy { opacity: 0; }
  #cmd.copied .icon-check { opacity: 1; }
</style>
</head>

    const now = performance.now();
    if (pointerIn) {
      const dt = Math.max((now - lastMove) / 1000, 0.004);
      // smoothed pointer velocity, image px / s
      mvx = mvx * 0.7 + ((x - mx) / dt) * 0.3;
      mvy = mvy * 0.7 + ((y - my) / dt) * 0.3;
      // activate along the swept path so fast moves leave no gaps
      const strength = Math.min(Math.hypot(mvx, mvy) / SPEED_REF, 1);
      const segs = Math.max(1, Math.ceil(Math.hypot(x - mx, y - my) / (R * 0.5)));
      for (let s = 1; s <= segs; s++) {
        activateAround(mx + (x - mx) * (s / segs), my + (y - my) * (s / segs), mvx / 60, mvy / 60, strength);
      }
    }
    pmx = mx; pmy = my;
    mx = x; my = y;
    lastMove = now;
    pointerIn = true;
  }, { passive: true });

  document.documentElement.addEventListener("mouseleave", () => { pointerIn = false; mx = my = -1e9; });
  addEventListener("blur", () => { pointerIn = false; mx = my = -1e9; });
  addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") { pointerIn = false; mx = my = -1e9; } });

  // --- frame loop ---
  const byColor = [];
  for (let i = 0; i < palette.length; i++) byColor.push(new Int32Array(CAP));
  const byColorN = new Int32Array(palette.length);

  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;

    if (ambientOn) rain(dt);

    // pointer velocity dies quickly once the mouse stops, so no crater forms around a resting cursor
    if (now - lastMove > 50) {
      mvx *= 0.55; mvy *= 0.55;
      if (mvx * mvx + mvy * mvy < 25) { mvx = 0; mvy = 0; }
    }

    const r = R, r2 = r * r;
    // the magnet works even on a resting cursor, so squares entering its radius must wake up
    if (pointerIn) activateAround(mx, my, 0, 0, 0);
    for (let i = 0; i < count; i++) {
      let ax = 0, ay = 0;
      if (pointerIn) {
        const dx = px[i] - mx, dy = py[i] - my;
        const d2 = dx * dx + dy * dy;
        if (d2 < r2) {
          const d = Math.sqrt(d2) || 1;
          const f1 = 1 - d / r;
          const fall = f1 * f1 * (3 - 2 * f1);
          const f = MAGNET * fall / d;
          ax += dx * f + mvx * COUPLE * fall * 8;
          ay += dy * f + mvy * COUPLE * fall * 8;
        }
      }

      if (mode[i] === 1) {
        // sand in the flipped world: grains drift upward into the dark
        ax -= vx[i] * 1.5;
        ay -= GRAV;
        vx[i] += ax * dt; vy[i] += ay * dt;
        if (vy[i] < -TERM) vy[i] = -TERM;
        px[i] += vx[i] * dt; py[i] += vy[i] * dt;
        if (py[i] < imgTop - 4) { deactivate(i); i--; }
        continue;
      }

      const hx = homeX(i), hy = homeY(i);
      ax += (hx - px[i]) * STIFF - vx[i] * DAMP;
      ay += (hy - py[i]) * STIFF - vy[i] * DAMP;
      vx[i] += ax * dt; vy[i] += ay * dt;
      px[i] += vx[i] * dt; py[i] += vy[i] * dt;

      let ddx = px[i] - hx, ddy = py[i] - hy;
      const dd2 = ddx * ddx + ddy * ddy;
      if (dd2 > MAXD * MAXD) {
        const dd = Math.sqrt(dd2);
        px[i] = hx + (ddx / dd) * MAXD;
        py[i] = hy + (ddy / dd) * MAXD;
        // bleed off outward velocity at the cap so squares glide along it instead of pinning
        const vr = (vx[i] * ddx + vy[i] * ddy) / dd;
        if (vr > 0) { vx[i] -= (ddx / dd) * vr; vy[i] -= (ddy / dd) * vr; }
        ddx = px[i] - hx; ddy = py[i] - hy;
      }
      if (ddx * ddx + ddy * ddy < 0.02 && vx[i] * vx[i] + vy[i] * vy[i] < 1) {
        deactivate(i); i--;
      }
    }

    ctx.drawImage(field, 0, 0, W, H, ox, oy, W * S, H * S);

    if (count > 0) {
      byColorN.fill(0);
      const cellS = P * S;
      // squares that haven't visibly left home are not redrawn at all: the untouched
      // background shows them, so the influence area picks up no dark veil
      ctx.fillStyle = INK;
      for (let i = 0; i < count; i++) {
        const c = cell[i];
        const ddx = px[i] - homeX(i), ddy = py[i] - homeY(i);
        if (ddx * ddx + ddy * ddy < 0.64) continue;
        // snap the ink patch to whole device pixels, matching how the scaled
        // field rasterizes cell edges - a fractional rect leaves ghost outlines
        const cx = c % cols, cy = (c / cols) | 0;
        const x0 = Math.round(ox + cx * P * S), y0 = Math.round(oy + cy * P * S);
        const x1 = Math.round(ox + (cx + 1) * P * S), y1 = Math.round(oy + (cy + 1) * P * S);
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
        byColor[cellColor[c]][byColorN[cellColor[c]]++] = i;
      }
      for (let k = 0; k < palette.length; k++) {
        const n = byColorN[k];
        if (!n) continue;
        ctx.fillStyle = palette[k];
        const list = byColor[k];
        for (let j = 0; j < n; j++) {
          const i = list[j];
          ctx.fillRect(ox + (px[i] - P / 2) * S, oy + (py[i] - P / 2) * S, cellS, cellS);
        }
      }
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // the bright center of the button's glow follows the cursor along the button
  const cmd = document.getElementById("cmd");
  cmd.addEventListener("pointermove", (e) => {
    const rect = cmd.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
    cmd.style.setProperty("--mx", (x + 2.5) + "px");
    cmd.style.setProperty("--my", (y + 2.5) + "px");
  });
  cmd.addEventListener("pointerleave", () => {
    cmd.style.setProperty("--mx", "50%");
    cmd.style.setProperty("--my", "50%");
  });

  // copy button: writes the command to the clipboard, shows a check for a moment
  let copiedTimer = 0;
  cmd.addEventListener("click", async () => {
    const text = "npx e2e init";
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    cmd.classList.add("copied");
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => cmd.classList.remove("copied"), 1400);
  });
})();
</script>
</body>
</html>
